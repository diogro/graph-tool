job_gcc_amd64:
  script:
    - ./autogen.sh
    - ./configure CXX="ccache g++" CXXFLAGS="-march=native" MOD_CXXFLAGS="-flto=auto" PYTHON=python3 --prefix=$PWD/install --with-python-module-path=$PWD/install/site-packages
    - CCACHE_BASEDIR=$PWD make $MAKEOPTS
    - make install
    - export PYTHONPATH=$PWD/install/site-packages
    - cd doc
    - make || true
    - ls *rst *md | parallel -m --halt-on-error 2 --jobs 16 sphinx-build -E -d envs/{#} -b doctest . builds/{#} {};
    - ls autosummary/*rst | sed "/GraphArtist/d" | parallel -m --halt-on-error 2 --jobs 16 sphinx-build -E -d envs/{#} -b doctest . builds/{#} {};
    - function demos { ls demos/*/[^_]*md | parallel -m --halt-on-error 0 --jobs 16 sphinx-build -E -d envs/demos{#} -b doctest . builds/demos{#} {}; }
    - demos || true
    - make || true
    - rm -rf /srv/http/graph-tool-doc-dev/*
    - cp -arv build/html/* /srv/http/graph-tool-doc-dev/
  tags:
    - amd64
  except:
    - tags

job_clang_amd64:
  script:
    - ./autogen.sh
    - ./configure CXX="ccache clang++" CXXFLAGS="" PYTHON=python3 --prefix=$PWD/install --with-python-module-path=$PWD/install/site-packages
    - CCACHE_BASEDIR=$PWD make $MAKEOPTS
    - make install
    - export PYTHONPATH=$PWD/install/site-packages
    - cd doc
    - make || true
    - ls *rst *md | sed "/GraphArtist/d" | parallel -m --halt-on-error 2 --jobs 16 sphinx-build -E -d envs/{#} -b doctest . builds/{#} {};
    - ls autosummary/*rst | sed "/GraphArtist/d" | parallel -m --halt-on-error 2 --jobs 16 sphinx-build -E -d envs/{#} -b doctest . builds/{#} {};
  tags:
    - amd64
  except:
    - tags

job_clang_cxx_amd64:
  script:
    - ./autogen.sh
    - ./configure CXX="ccache clang++" MOD_CXXFLAGS="-flto=thin" LDFLAGS="-Wl,-mllvm,-threads=8" PYTHON=python3 CXXFLAGS="-stdlib=libc++" LDFLAGS="-lc++abi" --disable-openmp
    - CCACHE_BASEDIR=$PWD make $MAKEOPTS
  tags:
    - amd64
  except:
    - tags

build_tarball:
  script:
    - ./autogen.sh
    - ./configure
    - make dist-bzip2
    - make dist-xz
    - bunzip2 -k *bz2
    - zstd *.tar
  only:
    - tags
  artifacts:
    paths:
      - graph-tool*bz2
      - graph-tool*xz
      - graph-tool*zst

.build_deb:
  tags:
    - deb
  variables:
    BASE: ""
    PLATFORM: ""
    MARCH: "x86-64"
  before_script:
    - export DEB_VERSION=1
    - export MARCH=$MARCH
  script:
    - img=`echo $BASE | sed s/:/_/`
    - img="${img}_${CI_COMMIT_SHORT_SHA}_${MARCH}"
    - cd release/debian
    - if [[ "$MARCH" = "x86-64" || "$MARCH" = "armv8-a" ]]; then MARCH_SUFFIX=""; else MARCH_SUFFIX="-${MARCH}"; fi
    - sed -i "s/__MARCH_SUFFIX/$MARCH_SUFFIX/" debian/control
    - docker buildx build --platform linux/$PLATFORM --build-arg BASE=$BASE --build-arg DEB_VERSION=$DEB_VERSION --build-arg REF=`git log -n1 --pretty='%H'` --build-arg MARCH=$MARCH --build-arg MARCH_SUFFIX=$MARCH_SUFFIX -t $img . --no-cache --pull --load --progress=plain
    - cid=`docker create $img`
    - docker cp ${cid}:build build
    - docker rm -v $cid
    - docker rmi $img -f
    - name=`echo $BASE | grep -o ":.*" | sed s/://`
    - aptly repo create $name || true
    - for f in `ls build/python3-graph-tool*.deb`; do nf=`echo $f | sed s/.deb/_${name}_${MARCH}.deb/`; mv $f $nf; aptly repo add $name $nf || true; done
    - aptly publish drop $name filesystem:skewed:/apt-git || true
    - aptly publish repo -distribution=$name $name filesystem:skewed:/apt-git || true
    - aptly publish update $name filesystem:skewed:/apt-git || true
  only:
    - tags
  artifacts:
    paths:
      - release/debian/build/*

.build_deb_git:
  extends: .build_deb
  before_script:
    - last_relase=$(git tag -l "release-*" --sort=version:refname | tail -n 1)
    - DEB_VERSION=$(git rev-list release-2.52..HEAD --count)
  only:
  except:
    - tags
  needs: ["job_gcc_amd64"]

