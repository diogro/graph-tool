build_docker:
  tags:
    - docker
  script:
    - cd release/docker
    - docker build --build-arg REF=`git log -n1 --pretty='%H'` -t tiagopeixoto/graph-tool:$CI_COMMIT_TAG . --no-cache --pull --progress=plain
    - docker login -u tiagopeixoto -p $DOCKER_TOKEN
    - docker tag tiagopeixoto/graph-tool:$CI_COMMIT_TAG docker.io/tiagopeixoto/graph-tool:$CI_COMMIT_TAG
    - docker push docker.io/tiagopeixoto/graph-tool:$CI_COMMIT_TAG
    - docker tag tiagopeixoto/graph-tool:$CI_COMMIT_TAG docker.io/tiagopeixoto/graph-tool:latest
    - docker push docker.io/tiagopeixoto/graph-tool:latest
    - docker rmi docker.io/tiagopeixoto/graph-tool -f
  only:
    - tags

build_docker_git:
  tags:
